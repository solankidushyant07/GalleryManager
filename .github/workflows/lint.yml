name: ESLint Check

on:
  push:
    branches: ["main"]
    paths:
      - "web/js/**"
      - "eslint.config.js"
      - "package.json"
      - ".github/workflows/lint.yml"
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run lint
