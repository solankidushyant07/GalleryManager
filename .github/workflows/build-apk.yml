name: Android Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true

      - name: Show toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --version

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle --no-daemon lintDebug --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: GalleryManager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GalleryManager-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
