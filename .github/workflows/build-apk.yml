name: Android Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CI diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-diagnostics
          {
            echo "GalleryManager CI diagnostics"
            echo "Run: ${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Workflow: ${GITHUB_WORKFLOW}"
            echo "Started: $(date -u)"
          } > ci-diagnostics/README.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true

      - name: Capture toolchain
        shell: bash
        run: |
          {
            echo "=== Java ==="
            java -version 2>&1
            echo
            echo "=== Gradle ==="
            gradle --version
            echo
            echo "=== Android SDK ==="
            sdkmanager --version
          } > ci-diagnostics/toolchain.txt 2>&1 || true

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest --stacktrace 2>&1 | tee ci-diagnostics/unit-tests.log

      - name: Run Android lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon lintDebug --stacktrace 2>&1 | tee ci-diagnostics/lint.log

      - name: Build debug APK
        id: apk
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace 2>&1 | tee ci-diagnostics/build.log

      - name: Collect generated Gradle reports
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p ci-diagnostics/gradle-reports ci-diagnostics/test-results
          if [ -d app/build/reports ]; then
            cp -R app/build/reports/. ci-diagnostics/gradle-reports/
          fi
          if [ -d app/build/test-results ]; then
            cp -R app/build/test-results/. ci-diagnostics/test-results/
          fi
          {
            echo "=== Step outcomes ==="
            echo "unit_tests=${{ steps.unit_tests.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "apk=${{ steps.apk.outcome }}"
            echo
            echo "=== Generated report files ==="
            find app/build/reports app/build/test-results -type f 2>/dev/null | sort || true
          } > ci-diagnostics/summary.txt

      - name: Upload debug APK
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: GalleryManager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GalleryManager-ci-diagnostics
          path: ci-diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Fail workflow when verification failed
        if: always()
        shell: bash
        env:
          UNIT_OUTCOME: ${{ steps.unit_tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          APK_OUTCOME: ${{ steps.apk.outcome }}
        run: |
          if [[ "$UNIT_OUTCOME" != "success" || "$LINT_OUTCOME" != "success" || "$APK_OUTCOME" != "success" ]]; then
            echo "One or more verification stages failed."
            echo "unit_tests=$UNIT_OUTCOME"
            echo "lint=$LINT_OUTCOME"
            echo "apk=$APK_OUTCOME"
            exit 1
          fi
